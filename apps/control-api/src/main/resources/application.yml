server:
  port: ${THREADBEACON_API_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: threadbeacon-control-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/threadbeacon}
    username: ${POSTGRES_USER:threadbeacon}
    password: ${POSTGRES_PASSWORD:threadbeacon-development-only}
    hikari:
      maximum-pool-size: ${THREADBEACON_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 15s
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

threadbeacon:
  auth:
    local-enabled: ${THREADBEACON_ALLOW_LOCAL_AUTH:true}
    username: ${THREADBEACON_LOCAL_AUTH_USERNAME:threadbeacon}
    password: ${THREADBEACON_LOCAL_AUTH_PASSWORD:change-me-at-least-16}
    user-id: ${THREADBEACON_LOCAL_AUTH_USER_ID:local-owner}
    email: ${THREADBEACON_LOCAL_AUTH_EMAIL:owner@threadbeacon.local}
    full-name: ${THREADBEACON_LOCAL_AUTH_FULL_NAME:Local Owner}
  node:
    registration-key: ${THREADBEACON_NODE_REGISTRATION_KEY:change-node-key-16}
  encryption:
    key: ${THREADBEACON_ENCRYPTION_KEY:change-this-encryption-key-32-bytes}
  s3:
    endpoint: ${THREADBEACON_S3_ENDPOINT:http://localhost:9000}
    access-key: ${THREADBEACON_S3_ACCESS_KEY:threadbeacon}
    secret-key: ${THREADBEACON_S3_SECRET_KEY:threadbeacon-development-secret}
    bucket: ${THREADBEACON_S3_BUCKET:threadbeacon-reports}

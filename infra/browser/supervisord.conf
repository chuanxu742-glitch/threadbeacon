[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
priority=10
command=/bin/sh -lc "exec Xvfb :99 -screen 0 ${SCREEN_GEOMETRY:-1440x900x24} -ac +extension GLX +render -noreset"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
priority=20
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
priority=30
command=/bin/sh -lc "exec chromium --disable-dev-shm-usage --disable-gpu --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --user-data-dir=/data/chromium --window-size=1440,900 --no-first-run --no-default-browser-check about:blank ${CHROMIUM_EXTRA_ARGS:-}"
environment=DISPLAY=":99",HOME="/home/browser"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
priority=40
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -noxdamage
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
priority=50
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

{{- if and (not .Values.gateway.existingSecret) (not .Values.controlPlane.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threadbeacon-execution.fullname" . }}
  labels:
    {{- include "threadbeacon-execution.labels" . | nindent 4 }}
type: Opaque
stringData:
  gateway-agent-token: {{ required "gateway.existingSecret is recommended; otherwise set gateway.agentToken" .Values.gateway.agentToken | quote }}
  gateway-control-token: {{ required "gateway.existingSecret is recommended; otherwise set gateway.controlToken" .Values.gateway.controlToken | quote }}
  node-registration-key: {{ required "controlPlane.existingSecret is recommended; otherwise set controlPlane.registrationKey" .Values.controlPlane.registrationKey | quote }}
{{- else if or (not .Values.gateway.existingSecret) (not .Values.controlPlane.existingSecret) }}
{{- fail "gateway.existingSecret and controlPlane.existingSecret must either both be set, or both omitted with explicit token values" }}
{{- end }}
